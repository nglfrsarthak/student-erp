name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    # The app must be importable with no environment configured at all:
    # `next build` imports every page module, and pages are force-dynamic, so
    # nothing should need a database connection to build. The docker job below
    # is the real check for this, since a Docker build has no DATABASE_URL.
    env:
      DATABASE_URL: postgresql://erp:erp_secret@localhost:5432/student_erp
      AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm 12 blocks dependency install scripts by default. Prisma needs its
      # engine postinstall and esbuild needs its binary installer.
      - name: Approve required install scripts
        run: npm install-scripts approve --all || true

      - name: Rebuild dependencies with scripts enabled
        run: npm rebuild prisma @prisma/engines esbuild

      # The generated client lives in src/generated/prisma, which is
      # gitignored, so a fresh checkout has no client to typecheck against.
      # `npm run build` also generates it, but typecheck runs first.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  migrate:
    name: Migration is in sync with schema
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_secret
          POSTGRES_DB: student_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d student_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://erp:erp_secret@localhost:5432/student_erp
      # `--from-migrations` replays the whole migration history into a shadow
      # database. Prisma 7 dropped the `--shadow-database-url` flag, so the URL
      # has to come from prisma.config.ts, which reads this variable.
      SHADOW_DATABASE_URL: postgresql://erp:erp_secret@localhost:5432/student_erp_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install-scripts approve --all || true
      - run: npm rebuild prisma @prisma/engines esbuild

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Create shadow database
        run: node scripts/create-shadow-db.mjs

      # Fails if the committed migrations no longer describe the schema, which
      # catches "someone edited schema.prisma and forgot to add a migration".
      - name: Verify no schema drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Seed
        run: npm run db:seed

  # The Dockerfile is the only thing that verifies the image actually builds and
  # boots. It is also the only environment with no DATABASE_URL at build time,
  # which is exactly what caught src/lib/prisma.ts throwing at import.
  docker:
    name: Docker stack builds and serves
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app to answer
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || echo 000)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "App is serving."
              exit 0
            fi
            sleep 10
          done
          echo "::error::App never became ready."
          docker compose logs
          exit 1

      - name: Confirm the database was seeded
        run: |
          docker compose exec -T db psql -U erp -d student_erp \
            -c 'SELECT count(*) AS students FROM "Student";' \
            -c 'SELECT count(*) AS courses FROM "Course";'

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v