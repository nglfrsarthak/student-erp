name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest

    # `next build` only needs these to *exist*; it never connects at build time
    # because every data page is force-dynamic.
    env:
      DATABASE_URL: postgresql://erp:erp_secret@localhost:5432/student_erp
      AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm 12 blocks dependency install scripts by default. Prisma needs its
      # engine postinstall and esbuild needs its binary installer.
      - name: Approve required install scripts
        run: npm install-scripts approve --all || true

      - name: Rebuild dependencies with scripts enabled
        run: npm rebuild prisma @prisma/engines esbuild

      # The generated client lives in src/generated/prisma, which is
      # gitignored, so a fresh checkout has no client to typecheck against.
      # `npm run build` also generates it, but typecheck runs first.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  migrate:
    name: Migration is in sync with schema
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_secret
          POSTGRES_DB: student_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d student_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://erp:erp_secret@localhost:5432/student_erp
      # `--from-migrations` replays the whole migration history into a shadow
      # database. Prisma 7 dropped the `--shadow-database-url` flag, so the URL
      # has to come from prisma.config.ts, which reads this variable.
      SHADOW_DATABASE_URL: postgresql://erp:erp_secret@localhost:5432/student_erp_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install-scripts approve --all || true
      - run: npm rebuild prisma @prisma/engines esbuild

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Create shadow database
        run: node scripts/create-shadow-db.mjs

      # Fails if the committed migrations no longer describe the schema, which
      # catches "someone edited schema.prisma and forgot to add a migration".
      - name: Verify no schema drift
        run: |
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code

      - name: Seed
        run: npm run db:seed