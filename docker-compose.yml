services:
  db:
    image: postgres:17-alpine
    container_name: student-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-student_erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app container waits on this, so `docker compose up` is a one-liner.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-student_erp}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-erp-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the host is the `db` service.
      DATABASE_URL: postgresql://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp_secret}@db:5432/${POSTGRES_DB:-student_erp}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-please-32bchars}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    # Apply migrations + seed on boot, then start the server.
    command: >
      sh -c "npx prisma migrate deploy && npm run db:seed && npm start"

volumes:
  erp-pgdata: